name: Job Alert

# Run every 2 hours, or manually via workflow_dispatch
on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

# Prevent overlapping runs from causing push conflicts
concurrency:
  group: job-alert
  cancel-in-progress: false

jobs:
  fetch-jobs:
    runs-on: ubuntu-latest

    # Need write access to push seen_jobs.json back to the repo
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run job alert script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Commit and push seen_jobs.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_jobs.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update seen_jobs.json [skip ci]"
            git pull --rebase origin main || git pull --rebase origin master || true
            git push || echo "::warning::Push failed â€” seen_jobs.json update not persisted this run"
          else
            echo "No changes to seen_jobs.json â€” skipping commit"
          fi
